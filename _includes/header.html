<header class="site-header" role="banner">
  <div class="site-header__inner">
    <a class="site-header__logo" href="{{ '/' | relative_url }}" aria-label="uFawkes home">uFawkes</a>

    <button
      class="nav-toggle"
      aria-expanded="false"
      aria-controls="main-nav"
      aria-label="Open navigation">
      <span></span><span></span><span></span>
    </button>

    <nav id="main-nav" class="main-nav" aria-label="Main navigation">
      <ul class="main-nav__list">
        {% for item in site.data.navigation.main %}
          <li class="main-nav__item{% if item.dropdown %} main-nav__item--has-dropdown{% endif %}">
            {% if item.dropdown %}
              <button class="main-nav__link main-nav__link--dropdown" aria-expanded="false" aria-haspopup="true">
                {{ item.title }} <span aria-hidden="true">▾</span>
              </button>
              <ul class="main-nav__dropdown" hidden>
                {% for child in item.children %}
                  <li>
                    <a
                      href="{{ child.url | relative_url }}"
                      class="main-nav__dropdown-link"
                      {% if page.url == child.url %}aria-current="page"{% endif %}>
                      {{ child.title }}
                    </a>
                  </li>
                {% endfor %}
              </ul>
            {% elsif item.external %}
              <a
                href="{{ item.url }}"
                class="main-nav__link{% if item.accent %} main-nav__link--accent{% endif %}"
                target="_blank"
                rel="noopener noreferrer">
                {{ item.title }}
              </a>
            {% else %}
              <a
                href="{{ item.url | relative_url }}"
                class="main-nav__link"
                {% if page.url == item.url %}aria-current="page"{% endif %}>
                {{ item.title }}
              </a>
            {% endif %}
          </li>
        {% endfor %}
      </ul>
    </nav>
  </div>
</header>

<script>
  (function () {
    var dropdownButtons = document.querySelectorAll(".main-nav__link--dropdown");

    function closeAllDropdowns() {
      dropdownButtons.forEach(function (btn) {
        btn.setAttribute("aria-expanded", "false");
        if (btn.nextElementSibling) {
          btn.nextElementSibling.hidden = true;
        }
      });
    }

    dropdownButtons.forEach(function (btn) {
      btn.addEventListener("click", function () {
        var expanded = this.getAttribute("aria-expanded") === "true";
        closeAllDropdowns();
        if (!expanded && this.nextElementSibling) {
          this.setAttribute("aria-expanded", "true");
          this.nextElementSibling.hidden = false;
        }
      });
    });

    document.addEventListener("click", function (event) {
      if (!event.target.closest(".main-nav__item--has-dropdown")) {
        closeAllDropdowns();
      }
    });

    var toggle = document.querySelector(".nav-toggle");
    var nav = document.getElementById("main-nav");
    if (toggle && nav) {
      toggle.addEventListener("click", function () {
        var open = nav.classList.toggle("is-open");
        toggle.setAttribute("aria-expanded", String(open));
      });
    }
  })();
</script>
